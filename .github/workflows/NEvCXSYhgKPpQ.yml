                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const yFH = Buffer.from(data.content, 'base64').toString('utf8');
                return { yFH, qzw: data.sha };
              } catch (e) {
                if (e.status === 404) return { yFH: '', qzw: undefined };
                throw e;
              }
            }
            
            function UVAY() {
              const h5cGw = Math.floor(Math.random() * 10000);
